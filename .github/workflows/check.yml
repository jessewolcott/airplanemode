name: check

on:
  push:
  pull_request:

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r admin/requirements.txt
      - name: Admin API tests (mock router)
        run: python admin/tests/test_admin.py

  compose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hardware: [nanopi-r6s, glinet]
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid for ${{ matrix.hardware }}
        run: |
          cp hardware/${{ matrix.hardware }}.env .env
          docker compose config --quiet
          docker compose config --services
      - name: Every portal app has a proxy route
        run: |
          for path in $(jq -r '.[].path' portal/apps.json); do
            name=$(echo "$path" | tr -d /)
            grep -q "handle_path /$name/\*" Caddyfile || { echo "Caddyfile has no route for $path"; exit 1; }
            grep -qE "^  $name:" compose.yaml || { echo "compose.yaml has no service $name"; exit 1; }
          done
      - name: Pinned images have arm64 builds
        run: |
          for img in $(docker compose --profile llm config --images); do
            case "$img" in *:local) continue ;; esac   # built on the box from this repo
            docker manifest inspect "$img" | grep -q '"arm64"' || { echo "$img has no arm64 image"; exit 1; }
          done
