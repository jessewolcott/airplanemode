<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirplaneMode</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #14171c; --line: #252a32; --ink: #d9d4c7; --dim: #8a877f; --accent: #f2b34b;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: .01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 32px; font-size: .95rem; }
  .apps { display: grid; gap: 12px; }
  a.app { display: block; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; transition: border-color .15s; }
  a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; }
  .app h2 { font-size: 1.1rem; margin: 0 0 4px; }
  .app p { margin: 0; color: var(--dim); font-size: .92rem; }
  .tag { display: inline-block; font: .7rem var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-top: 10px; }
  footer { margin-top: 40px; color: var(--dim); font: .75rem var(--mono); }
</style>
</head>
<body>
<main>
  <h1>Airplane<span>Mode</span></h1>
  <p class="sub">Everything here runs on this little box. No internet required.</p>
  <div class="apps" id="apps"><p class="sub">Loading apps…</p></div>
  <footer>airplanemode · local network only</footer>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
fetch("apps.json").then(r => r.json()).then(apps => {
  document.getElementById("apps").innerHTML = apps.map(a => `
    <a class="app" href="${esc(a.path)}">
      <h2>${esc(a.name)}</h2>
      <p>${esc(a.description)}</p>
      ${a.uses_llm ? '<span class="tag">uses the on-board model when available</span>' : ""}
    </a>`).join("");
}).catch(() => { document.getElementById("apps").innerHTML = '<p class="sub">Could not load the app list.</p>'; });
</script>
</body>
</html>
