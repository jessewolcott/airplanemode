# AirplaneMode: the whole box in one file.
# Pick a hardware profile first:  cp hardware/nanopi-r6s.env .env   (or hardware/glinet.env)
# Then:                           docker compose up -d
#
# App images are pinned to exact versions. To update an app, change its tag here and commit.

name: airplanemode

services:
  # Front door: the portal page plus one path per app (see Caddyfile).
  proxy:
    image: caddy:2.8-alpine
    # Bound to the router's LAN address only. Docker's own firewall rules can bypass
    # OpenWrt's, so binding to 0.0.0.0 could expose this port to the hotel network.
    ports:
      - "${LAN_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - drop-data:/srv/drop:ro         # Caddy sends Drop's files once Drop has said yes
      - caddy-data:/data
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}       # offline-popup redirects go here
      HTTP_PORT: ${HTTP_PORT:-8080}
    mem_limit: ${PROXY_MEM:-64m}
    restart: unless-stopped

  # Landing-page status, captive-portal check, the admin panel (Wi-Fi settings), and the
  # connectivity supervisor (auto-join saved networks, offline popup).
  # Built from this repo. It changes router settings through the router's own ubus API,
  # so it needs no privileges, just the router's address and a Wi-Fi-only login that
  # scripts/router-setup.sh creates (see .env).
  admin:
    build: ./admin
    image: airplanemode-admin:local
    environment:
      ROUTER_BACKEND: ${ROUTER_BACKEND:-openwrt}
      ROUTER_URL: ${ROUTER_URL:-http://host.docker.internal/ubus}
      ROUTER_USER: ${ROUTER_USER:-airplanemode}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LAN_IP: ${LAN_IP:-127.0.0.1}
      HTTP_PORT: ${HTTP_PORT:-8080}
      WAN_IFACE: ${WAN_IFACE:-wan}
      AUTOJOIN: ${AUTOJOIN:-1}
      OFFLINE_PORTAL: ${OFFLINE_PORTAL:-1}
      APPS_FILE: /config/apps.json
      # Without the "llm" profile the model apps (uses_llm in apps.json) don't run, so the
      # menu leaves them out too.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - admin-data:/data            # saved networks, apps hidden from the menu
      - ./portal/apps.json:/config/apps.json:ro   # the installed apps (restart admin after editing)
    # Use the router's own DNS (dnsmasq). Docker can't reach a resolver on the host's
    # 127.0.0.1, so it would otherwise fall back to public DNS, which hotels block before
    # sign-in, and the captive-portal check would wrongly report "offline".
    dns:
      - ${LAN_IP:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${ADMIN_MEM:-96m}
    restart: unless-stopped

  # Shared language model. Only runs when COMPOSE_PROFILES includes "llm" (NanoPi R6S profile).
  # Not published outside the box: apps reach it at http://llm:8080 on the internal network.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b12602
    profiles: ["llm"]
    command:
      - "-hf"
      - "${LLM_MODEL:-unsloth/gemma-4-E2B-it-GGUF:Q4_K_M}"
      - "--no-mmproj"               # text only: don't fetch or load the ~1 GB vision projector
      - "--reasoning"               # no "thinking" output; the apps want plain replies
      - "off"
      - "--cache-ram"               # host prompt cache; the default (8 GB) would outgrow mem_limit
      - "${LLM_CACHE_RAM:-256}"     # 256 MB holds ~6-9 app prompts of ~1000 tokens (decision 0024)
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-t"
      - "${LLM_THREADS:-4}"
      - "-np"
      - "${LLM_SLOTS:-2}"
      - "-c"
      - "${LLM_CTX:-4096}"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - models:/models
    # Which CPU cores the model may use. On the R6S, only the fast Cortex-A76 cores (4-7):
    # spread over the slow A55s too, every token waits for the slowest thread. Empty = any.
    cpuset: "${LLM_CPUS:-}"
    mem_limit: ${LLM_MEM:-3500m}
    restart: unless-stopped

  # ---- apps ----
  # Apps that need the model (darklight, guide, couch) run only with the "llm" profile.
  darklight:
    profiles: ["llm"]           # model app: not on the GL.iNet (lite) profile
    image: ghcr.io/jessewolcott/airplanemode-darklight:0.3.2
    environment:
      LLM_URL: ${LLM_URL-http://llm:8080}
    mem_limit: ${DARKLIGHT_MEM:-256m}
    restart: unless-stopped

  drop:
    image: ghcr.io/jessewolcott/airplanemode-drop:0.3.0
    environment:
      DROP_MAX_BYTES: ${DROP_MAX_BYTES:-4g}
      DROP_MAX_FILE: ${DROP_MAX_FILE:-2g}
      DROP_KEEP_DAYS: ${DROP_KEEP_DAYS:-7}
      ADMIN_URL: http://admin:8000    # to recognise the admin (who can turn downloads off)
    volumes:
      - drop-data:/data
    mem_limit: ${DROP_MEM:-128m}
    restart: unless-stopped

  # Plays the videos and music on Drop. The browser streams them from /drop/ directly.
  cinema:
    image: ghcr.io/jessewolcott/airplanemode-cinema:0.2.0
    environment:
      DROP_URL: http://drop:8000
      ADMIN_URL: http://admin:8000    # who's who names in watch parties (decision 0023)
    volumes:
      - cinema-data:/data           # posters only
    mem_limit: ${CINEMA_MEM:-64m}
    restart: unless-stopped

  # An endless feed of the videos in Drop's "QuickShot" folder. Comments, likes and views live
  # in its own volume, so they survive restarts and updates.
  quickshot:
    image: ghcr.io/jessewolcott/airplanemode-quickshot:0.1.3
    environment:
      DROP_URL: http://drop:8000
      ADMIN_URL: http://admin:8000    # the admin can delete any comment
    volumes:
      - quickshot-data:/data        # comments.json, stats.json
    mem_limit: ${QUICKSHOT_MEM:-64m}
    restart: unless-stopped

  # TV Board: who's home, notes and reservations from phones, and a slideshow of Drop's TV
  # folder, on any screen at /tv/screen.
  tv:
    image: ghcr.io/jessewolcott/airplanemode-tv:0.1.0
    environment:
      DROP_URL: http://drop:8000
      ADMIN_URL: http://admin:8000    # who's home, who's who names, the admin
    volumes:
      - tv-data:/data               # notes and reservations
    mem_limit: ${TV_MEM:-64m}
    restart: unless-stopped

  # Doom (PrBoom+ in WebAssembly): static files only, the game runs in the browser. Plays
  # Freedoom, the Layover episode, and .wad files from Drop.
  doom:
    image: ghcr.io/jessewolcott/airplanemode-doom:0.1.1
    mem_limit: ${DOOM_MEM:-32m}
    restart: unless-stopped

  guide:
    profiles: ["llm"]           # model app: not on the GL.iNet (lite) profile
    image: ghcr.io/jessewolcott/airplanemode-guide:0.1.2
    environment:
      LLM_URL: ${LLM_URL-http://llm:8080}
    volumes:
      - guide-data:/data            # the offline guide (~260 MB), downloaded by update.sh's run
    mem_limit: ${GUIDE_MEM:-256m}
    restart: unless-stopped

  # Gate Change: colour-and-number card game, rooms on the hotspot + bots. In memory only.
  gatechange:
    image: ghcr.io/jessewolcott/airplanemode-gatechange:0.2.0
    environment:
      ADMIN_URL: http://admin:8000    # who's who names on seats (decision 0021)
    mem_limit: ${GATECHANGE_MEM:-64m}
    restart: unless-stopped

  # Passport: travel deck-builder, rooms on the hotspot + bots. In memory only.
  passport:
    image: ghcr.io/jessewolcott/airplanemode-passport:0.2.0
    environment:
      ADMIN_URL: http://admin:8000    # who's who names on seats (decision 0021)
    mem_limit: ${PASSPORT_MEM:-64m}
    restart: unless-stopped

  # Wayfarer: travel trivia. Questions ship in the image (made from Wikivoyage); high scores in its volume.
  wayfarer:
    image: ghcr.io/jessewolcott/airplanemode-wayfarer:0.2.1
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-UTC}                # the daily flight changes at local midnight
    volumes:
      - wayfarer-data:/data         # scores.json
    mem_limit: ${WAYFARER_MEM:-64m}
    restart: unless-stopped

  # The Couch: therapist simulator. Conversations stay in the browser; nothing is stored on the box.
  couch:
    profiles: ["llm"]           # model app: not on the GL.iNet (lite) profile
    image: ghcr.io/jessewolcott/airplanemode-couch:0.2.4
    environment:
      LLM_URL: ${LLM_URL-http://llm:8080}
    mem_limit: ${COUCH_MEM:-64m}
    restart: unless-stopped

networks:
  default:
    name: airplanemode

volumes:
  models:
  caddy-data:
  admin-data:
  drop-data:
  cinema-data:
  quickshot-data:
  tv-data:
  guide-data:
  wayfarer-data:
